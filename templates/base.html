<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SecureLens | أداة ذكية لفحص الويب{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/logo.jpeg') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="{{ url_for('index') }}" class="brand">
        <img src="{{ url_for('static', filename='img/logo.jpeg') }}" alt="SecureLens" class="brand-logo">
        <span class="brand-text">SecureLens <small>أداة ذكية لفحص الويب</small></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <button type="button" class="nav-close" id="navClose" aria-label="إغلاق القائمة">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
        <a href="{{ url_for('index') }}">الرئيسية</a>
        <a href="{{ url_for('how_it_works') }}">كيف يعمل</a>
        <a href="{{ url_for('history') }}">سجل الفحوصات</a>
        <a href="{{ url_for('about') }}">عن المشروع</a>
      </nav>
      <button type="button" class="nav-toggle" id="navToggle" aria-label="فتح القائمة" aria-expanded="false" aria-controls="navLinks">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main class="container main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <p>أداة ذكية لفحص الويب - فحص سلبي (Passive) وغير هجومي، لأصحاب المواقع والمواقع المصرَّح بفحصها فقط.</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
