# ملف cloud-init اختياري لنشر SecureLens تلقائياً على Azure VM (Ubuntu).
# يُستخدم عند إنشاء الـ VM عبر خيار "Custom data" أو Azure CLI (--custom-data).

#cloud-config
package_update: true
packages:
  - git
  - python3
  - python3-venv
  - python3-pip
  - nginx

runcmd:
  - cd /opt
  - git clone https://github.com/your-org/securelens.git securelens || true
  - cd /opt/securelens && bash scripts/setup_linux.sh
  - cp /opt/securelens/deploy/nginx.conf /etc/nginx/sites-available/securelens.conf
  - ln -sf /etc/nginx/sites-available/securelens.conf /etc/nginx/sites-enabled/securelens.conf
  - systemctl reload nginx
  - cp /opt/securelens/deploy/securelens.service /etc/systemd/system/securelens.service
  - systemctl daemon-reload
  - systemctl enable --now securelens
