# نموذج إعداد Apache كـ Reverse Proxy أمام Gunicorn لتطبيق SecureLens.
# يتطلب تفعيل: sudo a2enmod proxy proxy_http ssl
# انسخ هذا الملف إلى /etc/apache2/sites-available/securelens.conf ثم:
#   sudo a2ensite securelens.conf
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName your-domain.example
    Redirect permanent / https://your-domain.example/
</VirtualHost>

<VirtualHost *:443>
    ServerName your-domain.example

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/your-domain.example/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/your-domain.example/privkey.pem

    Alias /static/ /opt/securelens/static/
    <Directory /opt/securelens/static/>
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /static/ !
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/securelens_error.log
    CustomLog ${APACHE_LOG_DIR}/securelens_access.log combined
</VirtualHost>
